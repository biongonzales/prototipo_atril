<script>
/* ============================================================
   Edición de la voz en el Ensayo: cambiar la duración y la altura de las notas, escribir notas en los silencios,
   convertir notas en silencio, añadir compases al final y escribir la letra bajo las notas. El resultado se guarda
   como una versión nueva (TÍTULO V1, V2…) en la Biblioteca.

   Criterios:
   - El archivo original nunca se modifica; cada guardado es un archivo nuevo.
   - Se edita sobre los eventos originales del MIDI: solo cambian las notas tocadas; tempo, instrumentos,
     controladores, etc. se conservan. La letra se guarda como eventos de letra estándar (meta 0x05).
   - Acortar deja un silencio (nada se corre). Alargar usa primero el silencio que sigue; si aun así pisa otra nota,
     esa nota y las siguientes se corren (pasan al compás siguiente si hace falta) y nunca se borran. Insertar una
     nota o un silencio entre otras corre todo lo que sigue. La pieza crece con compases nuevos si hace falta.
   - Si la voz tiene notas simultáneas (divisi), solo se editan las notas visibles; las demás no se tocan.
   ============================================================ */
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const EPS = 1e-6;
const MAX_COMPASES_EXTRA = 64;

const DURACIONES = [
  { l: 4, n: 'Redonda' }, { l: 3, n: 'Blanca punt.' }, { l: 2, n: 'Blanca' }, { l: 1.5, n: 'Negra punt.' },
  { l: 1, n: 'Negra' }, { l: 0.75, n: 'Corchea punt.' }, { l: 0.5, n: 'Corchea' }, { l: 0.25, n: 'Semicorchea' }
];
// Rangos habituales (MIDI) por voz: solo sirven para avisar, nunca para impedir.
const RANGOS = [
  { re: /sopr/i, lo: 60, hi: 84, nombre: 'soprano', txt: 'DO4–DO6' },
  { re: /contr|alto/i, lo: 55, hi: 74, nombre: 'contralto', txt: 'SOL3–RE5' },
  { re: /tenor/i, lo: 48, hi: 69, nombre: 'tenor', txt: 'DO3–LA4' },
  { re: /baj|bass|bar[ií]t/i, lo: 40, hi: 64, nombre: 'bajo', txt: 'MI2–MI4' }
];
const NOMBRES = ['DO', 'DO♯', 'RE', 'RE♯', 'MI', 'FA', 'FA♯', 'SOL', 'SOL♯', 'LA', 'LA♯', 'SI'];
const nombreNota = (m) => NOMBRES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const num = (x) => String(Math.round(x * 100) / 100).replace('.', ',');
const nombreDur = (l) => { const d = DURACIONES.find((x) => Math.abs(x.l - l) < EPS); return d ? d.n : num(l) + ' tiempos'; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clonar = (o) => JSON.parse(JSON.stringify(o));

/* ------------------------------------------------------------------ estado */
// ov: cambios sobre las notas del archivo, por clave «pista:evento» (tiempos en pulsos de negra):
//   { midi?, start?, end?, letra?, extras?, del? }         → nota existente modificada, o borrada (queda un silencio)
//     letra = estrofa 1; extras = estrofas 2, 3… (cada estrofa es un evento de letra en el mismo instante de la nota)
//   { nuevo: true, t, ch, midi, start, end, vel, letra? }   → nota escrita por el usuario (clave «+n»)
// extra: compases de silencio añadidos al final de la pieza.
// warps: cambios de tiempo que afectan a TODAS las voces a la vez (alargar/acortar un tramo, insertar tiempo), en orden:
//   { s, e, L, d }  → el tramo [s,e) pasa a medir L (d = L − (e − s)); lo posterior se corre d; lo de dentro se escala
//   { s, e: s, d }  → se inserta tiempo d en s (todo lo que empieza en s o después se corre d)
// Las notas sin cambio propio se calculan a partir de las originales pasando por los warps; ov ya va en tiempo final.
const ed = {
  activo: false, key: null, rs: null, ov: {}, extra: 0, warps: [], estrofas: 1, hist: [{ ov: {}, extra: 0, warps: [] }], pos: 0,
  libId: null, base: new Map(), nMeasBase: 0, nuevoId: 0, guardando: false
};
// Tiempo (en pulsos de negra) tras aplicar los warps `lista`. esFin: el instante es el final de una nota (no el inicio).
function tiempo(x, esFin, lista) {
  (lista || ed.warps).forEach((w) => {
    if (w.e - w.s < EPS) { if (esFin ? x > w.s + EPS : x > w.s - EPS) x += w.d; }
    else if (x >= w.e - EPS) x += w.d;
    else if (x > w.s + EPS) x = w.s + (x - w.s) * w.L / (w.e - w.s);
  });
  return x;
}
let P = null;
const S = () => P.estado();
const linea = () => P.linea();
const idxDe = (k) => (k ? linea().findIndex((n) => n.key === k) : -1);
const cambios = () => Object.keys(ed.ov).length + ed.extra + ed.warps.length;

function resumen() {
  const r = { total: cambios(), duraciones: 0, alturas: 0, agregadas: 0, sustituidas: 0, letras: 0, compases: ed.extra, sincronizadas: ed.warps.length };
  Object.values(ed.ov).forEach((o) => {
    if (o.nuevo) r.agregadas++;
    else if (o.del) r.sustituidas++;
    else { if (o.midi !== undefined) r.alturas++; if (o.start !== undefined || o.end !== undefined) r.duraciones++; }
    if ((o.letra !== undefined || o.extras !== undefined) && !o.del) r.letras++;
  });
  return r;
}

/* ------------------------------------------------------------------ escritura del MIDI */
function vlq(n) { const o = [n & 127]; while ((n >>= 7)) o.unshift((n & 127) | 128); return o; }
const utf8 = (s) => new TextEncoder().encode(s);

/**
 * Serializa el MIDI original (raw, producido por parseMidi) aplicando los cambios `ov`.
 * Las pistas y eventos no tocados se escriben igual que estaban; el original no se muta.
 * extra/totalBeats: si se añadieron compases al final, el fin de cada pista se alarga hasta el final de la pieza.
 */
function escribirMidi(raw, ov, extra, totalBeats, warps) {
  const ppq = raw.ppq;
  warps = warps || [];
  const finMinimo = extra > 0 || warps.length ? Math.round(totalBeats * ppq) : 0;
  const pistas = raw.tracks.map((t, ti) => {
    const evs = t.events.map((e, i) => Object.assign({ i }, e));
    // los cambios de tiempo de todas las voces mueven todos los eventos de la pista (notas, letras, tempo…)
    if (warps.length) evs.forEach((e) => { const fin = e.st !== undefined && ((e.st & 0xF0) === 0x80 || ((e.st & 0xF0) === 0x90 && e.b === 0)); e.tick = Math.round(tiempo(e.tick / ppq, fin, warps) * ppq); });
    const borrar = new Set();
    const nuevo = (e) => { e.i = evs.length; evs.push(e); return e; };
    t.notes.forEach((n) => {
      let o = ov[ti + ':' + n.on];
      if (warps.length && n.ch !== 9 && !(o && o.del)) {
        // Con cambios de tiempo se escribe cada nota tal como se ve (en la cuadrícula de semicorcheas): así lo guardado
        // es idéntico a lo mostrado y, al reabrirlo, los tiempos no cambian.
        const q = (x) => Math.round(x * 4) / 4, s0 = q(n.start / ppq);
        let e0 = q(n.end / ppq); if (e0 <= s0) e0 = s0 + 0.25;
        o = Object.assign({ start: tiempo(s0, false, warps), end: tiempo(e0, true, warps) }, o || {});
      }
      if (!o) return;
      if (o.del) {
        borrar.add(n.on); if (n.off >= 0) borrar.add(n.off); if (n.letraEv >= 0) borrar.add(n.letraEv); (n.extrasEv || []).forEach((i) => borrar.add(i));
        return;
      }
      if (o.midi !== undefined) { evs[n.on].a = o.midi; if (n.off >= 0) evs[n.off].a = o.midi; }
      if (o.start !== undefined) evs[n.on].tick = Math.round(o.start * ppq);
      if (o.end !== undefined) {
        const fin = Math.max(Math.round(o.end * ppq), evs[n.on].tick + 1);
        if (n.off >= 0) evs[n.off].tick = fin;
        else nuevo({ tick: fin, st: 0x80 | n.ch, a: evs[n.on].a, b: 0 });   // la nota no tenía note-off
      }
      const evLetras = [n.letraEv].concat(n.extrasEv || []).filter((i) => i >= 0);
      if (o.letra !== undefined || o.extras !== undefined) {
        // se reescriben todas las estrofas de la nota, en orden (las vacías del medio llevan un espacio para no perder su lugar)
        evLetras.forEach((i) => borrar.add(i));
        escribirEstrofas(nuevo, evs[n.on].tick, o.letra !== undefined ? o.letra : n.letra, o.extras !== undefined ? o.extras : n.extras);
      } else if (o.start !== undefined) {
        evLetras.forEach((i) => { evs[i].tick = evs[n.on].tick; });   // la letra acompaña a su nota si esta se mueve o se recorta
      }
    });
    // notas escritas por el usuario
    Object.keys(ov).forEach((k) => {
      const o = ov[k];
      if (!o.nuevo || o.t !== ti) return;
      const ini = Math.round(o.start * ppq), fin = Math.max(Math.round(o.end * ppq), ini + 1);
      nuevo({ tick: ini, st: 0x90 | o.ch, a: o.midi, b: o.vel || 80 });
      nuevo({ tick: fin, st: 0x80 | o.ch, a: o.midi, b: 0x40 });
      escribirEstrofas(nuevo, ini, o.letra, o.extras);
    });
    let fin = 0;
    const lista = evs.filter((e) => {
      if (borrar.has(e.i)) return false;
      if (e.meta === 0x2F) { fin = Math.max(fin, e.tick); return false; }   // el fin de pista se reescribe al final
      return true;
    });
    // En un mismo instante, primero se apagan las notas y después se encienden las nuevas.
    const clase = (e) => {
      if (e.st === undefined) return 1;
      const t4 = e.st & 0xF0;
      if (t4 === 0x80 || (t4 === 0x90 && e.b === 0)) return 0;
      return t4 === 0x90 ? 2 : 1;
    };
    lista.sort((a, b) => a.tick - b.tick || clase(a) - clase(b) || a.i - b.i);
    fin = Math.max(fin, finMinimo, lista.length ? lista[lista.length - 1].tick : 0);
    lista.push({ tick: fin, meta: 0x2F, data: new Uint8Array(0) });

    const bytes = [];
    let prev = 0;
    lista.forEach((e) => {
      vlq(e.tick - prev).forEach((x) => bytes.push(x)); prev = e.tick;
      if (e.meta !== undefined) { bytes.push(0xFF, e.meta); vlq(e.data.length).forEach((x) => bytes.push(x)); e.data.forEach((x) => bytes.push(x)); }
      else if (e.sysex !== undefined) { bytes.push(e.sysex); vlq(e.data.length).forEach((x) => bytes.push(x)); e.data.forEach((x) => bytes.push(x)); }
      else if ((e.st & 0xF0) === 0xC0 || (e.st & 0xF0) === 0xD0) bytes.push(e.st, e.a);
      else bytes.push(e.st, e.a, e.b);
    });
    return bytes;
  });
  const n = pistas.length, fmt = raw.format || 0;
  const out = [0x4D, 0x54, 0x68, 0x64, 0, 0, 0, 6, (fmt >> 8) & 255, fmt & 255, (n >> 8) & 255, n & 255, (ppq >> 8) & 255, ppq & 255];
  pistas.forEach((b) => {
    out.push(0x4D, 0x54, 0x72, 0x6B, (b.length >>> 24) & 255, (b.length >>> 16) & 255, (b.length >>> 8) & 255, b.length & 255);
    for (let i = 0; i < b.length; i++) out.push(b[i]);
  });
  return new Uint8Array(out);
}
// Escribe la letra de una nota: estrofa 1 y después las demás, cada una como evento de letra en el mismo instante.
function escribirEstrofas(nuevo, tick, letra, extras) {
  const v = [letra || ''].concat(extras || []);
  while (v.length && !v[v.length - 1]) v.pop();
  v.forEach((t) => nuevo({ tick, meta: 0x05, data: utf8(t || ' ') }));
}
function aBase64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

/* ------------------------------------------------------------------ aplicar los cambios al modelo */
const polifonica = (v) => {
  if (v._poli !== undefined) return v._poli;
  let fin = -1, poli = false;
  v.base.slice().sort((a, b) => a.start - b.start).forEach((n) => { if (n.start < fin - EPS) poli = true; fin = Math.max(fin, n.end); });
  return (v._poli = poli);
};
function conCambios(b) {
  const o = ed.ov[b.key];
  if (!o && !ed.warps.length) return b;
  if (o && o.del) return null;
  const w = o || {};
  return Object.assign({}, b, {
    midi: w.midi !== undefined ? w.midi : b.midi,
    start: w.start !== undefined ? w.start : tiempo(b.start, false),
    end: w.end !== undefined ? w.end : tiempo(b.end, true),
    letra: w.letra !== undefined ? w.letra : b.letra,
    extras: w.extras !== undefined ? w.extras : (b.extras || [])
  });
}
// Recalcula las notas y la línea de cada voz a partir de las originales + cambios. El reproductor las lee en vivo.
function reconstruir() {
  const song = S().song;
  let contenido = 0;
  song.voices.forEach((v) => {
    if (!v.base) return;
    const notas = [];
    v.base.forEach((b) => { const n = conCambios(b); if (n && n.end - n.start > EPS) notas.push(n); });
    Object.keys(ed.ov).forEach((k) => {
      const o = ed.ov[k];
      if (o.nuevo && o.t === v.t && o.ch === v.ch && o.end - o.start > EPS) notas.push({ midi: o.midi, start: o.start, end: o.end, key: k, letra: o.letra || '', extras: o.extras || [], vel: o.vel });
    });
    notas.sort((a, b) => a.start - b.start || a.midi - b.midi);
    v.notes = notas;
    v.line = P.monoLine(notas);
    notas.forEach((n) => { contenido = Math.max(contenido, n.end); });
  });
  // compases: los de la pieza (más o menos largos si cambió el tiempo) y los añadidos; siempre caben todas las notas
  const baseComp = ed.warps.length ? Math.ceil(tiempo(ed.nMeasBase * song.mb, true) / song.mb - EPS) : ed.nMeasBase;
  song.nMeas = Math.max(1, baseComp + ed.extra, Math.ceil(contenido / song.mb - EPS));
  song.total = song.nMeas * song.mb;
}
function normalizar(k, o) {
  const b = ed.base.get(k);
  if (!b) return;   // las notas nuevas no tienen original con el que comparar
  if (o.del) { delete o.midi; delete o.start; delete o.end; delete o.letra; delete o.extras; return; }
  if (o.midi !== undefined && o.midi === b.midi) delete o.midi;
  if (o.start !== undefined && Math.abs(o.start - tiempo(b.start, false)) < EPS) delete o.start;
  if (o.end !== undefined && Math.abs(o.end - tiempo(b.end, true)) < EPS) delete o.end;
  if (o.letra !== undefined && (o.letra || '') === (b.letra || '')) delete o.letra;
  if (o.extras !== undefined && JSON.stringify(o.extras) === JSON.stringify(b.extras || [])) delete o.extras;
}
function guardarHist() {
  ed.hist = ed.hist.slice(0, ed.pos + 1);
  ed.hist.push({ ov: clonar(ed.ov), extra: ed.extra, warps: clonar(ed.warps) });
  ed.pos++;
}
function mezclar(cambiosNuevos) {
  const nuevo = clonar(ed.ov);
  Object.keys(cambiosNuevos).forEach((k) => {
    const val = cambiosNuevos[k], cur = nuevo[k];
    if (val === null || (val.del && cur && cur.nuevo)) { delete nuevo[k]; return; }   // borrar una nota nueva la elimina del todo
    const o = Object.assign(cur || {}, val);
    normalizar(k, o);
    if (Object.keys(o).length) nuevo[k] = o; else delete nuevo[k];
  });
  ed.ov = nuevo;
}
function aplicar(cambiosNuevos) {
  mezclar(cambiosNuevos);
  guardarHist();
  refrescar();
}
// Cambio de tiempo que afecta a todas las voces; c: cambios propios (ya en tiempo final) que se aplican en el mismo paso.
function aplicarWarp(w, c) {
  Object.values(ed.ov).forEach((o) => {
    if (o.start !== undefined) o.start = tiempo(o.start, false, [w]);
    if (o.end !== undefined) o.end = tiempo(o.end, true, [w]);
  });
  ed.warps = ed.warps.concat([w]);
  Object.keys(ed.ov).forEach((k) => { normalizar(k, ed.ov[k]); if (!Object.keys(ed.ov[k]).length) delete ed.ov[k]; });
  if (c) mezclar(c);
  guardarHist();
  refrescar();
}
const sincronizar = () => $('#ed-sync').checked;
function restaurar(s) { ed.ov = clonar(s.ov); ed.extra = s.extra; ed.warps = clonar(s.warps); refrescar(); }
function refrescar() {
  reconstruir();
  P.render();   // dispara pintar() y actualizarPanel() por el enganche alRenderizar
}

/* ------------------------------------------------------------------ operaciones */
const colorSwal = () => {
  const cs = getComputedStyle(document.documentElement);
  return { background: cs.getPropertyValue('--superficie').trim(), color: cs.getPropertyValue('--slate-900').trim() };
};
function confirmar(opciones) {
  return Swal.fire(Object.assign({ icon: 'warning', showCancelButton: true, confirmButtonColor: '#0f766e', cancelButtonColor: '#64748b', reverseButtons: true }, colorSwal(), opciones)).then((r) => r.isConfirmed);
}
const aviso = (t) => toastBase('warning', t);

function elegir(key, sonar) {
  ed.key = key; ed.rs = null;
  pintar(); actualizarPanel();
  const n = linea()[idxDe(key)];
  if (n && sonar && !P.reproduciendo()) P.previsualizar(n.midi);
}
function elegirSilencio(ini) {
  if (!huecoEn(ini)) return;
  ed.rs = { ini }; ed.key = null;
  pintar(); actualizarPanel();
}
function vecina(dir) {
  const l = linea();
  if (!l.length) return;
  if (ed.rs) {   // con un silencio elegido, ◀ ▶ mueven el punto de inserción de tiempo en tiempo dentro del hueco
    const h = huecoEn(ed.rs.ini);
    if (h) {
      const sig = dir > 0 ? Math.floor(h.ini + EPS) + 1 : Math.ceil(h.ini - EPS) - 1;
      if (sig >= h.desde - EPS && sig < h.fin - EPS) { ed.rs = { ini: sig }; pintar(); actualizarPanel(); return; }
    }
  }
  let i = idxDe(ed.key);
  if (i < 0 && ed.rs) {   // desde un silencio: la nota siguiente o anterior a ese punto
    const ini = ed.rs.ini;
    i = dir > 0 ? l.findIndex((n) => n.start >= ini - EPS) : (() => { let r = -1; l.forEach((n, j) => { if (n.end <= ini + EPS) r = j; }); return r; })();
    if (i < 0) i = dir > 0 ? l.length - 1 : 0;
  } else {
    i = i < 0 ? (dir > 0 ? 0 : l.length - 1) : Math.max(0, Math.min(l.length - 1, i + dir));
  }
  elegir(l[i].key, true);
  const pieza = P.piezas().find((p) => p.noteIdx === i);
  if (pieza && pieza.g.scrollIntoView) pieza.g.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// Notas de la línea que quedarían pisadas si la nota idx terminara en nuevoFin.
function pisadas(idx, nuevoFin) {
  const l = linea(), out = [];
  for (let j = idx + 1; j < l.length && l[j].start < nuevoFin - EPS; j++) out.push(j);
  return out;
}
// Hueco libre de la voz que contiene la posición ini (null si ahí suena una nota): { ini, desde, fin }.
function huecoEn(ini) {
  const total = S().song.total;
  let fin = total, desde = 0;
  for (const n of linea()) {
    if (n.start <= ini + EPS && n.end > ini + EPS) return null;
    if (n.start > ini + EPS) fin = Math.min(fin, n.start);
    else desde = Math.max(desde, n.end);
  }
  return ini < total - EPS ? { ini, desde, fin } : null;
}

// Corre hacia delante, solo lo necesario, las notas desde la posición `desde` para que ninguna quede pisada
// por algo que termina en `cursor`. Anota los cambios en c y devuelve cuántas notas se corrieron y dónde acaba todo.
function cascada(desde, cursor, c) {
  const l = linea();
  let movidas = 0, fin = cursor;
  for (let j = l.findIndex((m) => m.start >= desde - EPS); j >= 0 && j < l.length; j++) {
    const m = l[j];
    if (m.start >= cursor - EPS) break;
    const d = cursor - m.start;
    c[m.key] = { start: m.start + d, end: m.end + d };
    cursor = m.end + d; fin = cursor; movidas++;
  }
  return { movidas, fin };
}
// Corre todas las notas desde `desde` exactamente `delta` pulsos (para insertar algo en medio).
function correr(desde, delta, c) {
  let movidas = 0, fin = 0;
  linea().forEach((m) => { if (m.start >= desde - EPS) { c[m.key] = { start: m.start + delta, end: m.end + delta }; movidas++; fin = Math.max(fin, m.end + delta); } });
  return { movidas, fin };
}
// Si la voz queda más larga que la pieza, se añaden los compases que hagan falta. false si se pasa del máximo.
function asegurarCompases(fin) {
  const song = S().song, faltan = Math.ceil(fin / song.mb - EPS) - song.nMeas;
  if (faltan <= 0) return true;
  if (ed.extra + faltan > MAX_COMPASES_EXTRA) { aviso('La pieza no puede crecer tanto (máximo ' + MAX_COMPASES_EXTRA + ' compases añadidos).'); return false; }
  ed.extra += faltan;
  return true;
}
const avisoCorridas = (m) => { if (m) toastBase('info', m === 1 ? 'La nota siguiente se corrió.' : `Las ${m} notas siguientes se corrieron.`); };

function cambiarDuracion(L) {
  if (ed.rs) { insertarNota(L); return; }
  const l = linea(), idx = idxDe(ed.key);
  if (idx < 0) return;
  const n = l[idx], nuevoFin = n.start + L;
  if (Math.abs(n.end - n.start - L) < EPS) return;
  if (sincronizar()) {   // todas las voces: lo que suena en ese tramo se estira igual y lo posterior se corre
    aplicarWarp({ s: n.start, e: n.end, L, d: L - (n.end - n.start) });
    return;
  }
  const c = {};
  let r = { movidas: 0, fin: nuevoFin };
  if (nuevoFin > n.end + EPS) r = cascada(n.end, nuevoFin, c);   // alargar: las notas que estorban se corren al compás siguiente
  c[n.key] = { end: nuevoFin };
  if (!asegurarCompases(r.fin)) return;
  aplicar(c);
  avisoCorridas(r.movidas);
}

// Insertar entre notas: en la posición elegida (antes o después de la nota, o el punto del silencio) se hace sitio
// y todo lo que viene después se corre. `nota`: escribe una nota nueva; si no, solo deja un silencio.
function insertarEn(pos, L, nota) {
  const v = P.voz();
  if (v.t === undefined) { aviso('Esta voz no se puede editar.'); return; }
  const c = {}, l = linea();
  const r = sincronizar() ? { movidas: 0, fin: 0 } : correr(pos, L, c);
  let key = null;
  if (nota) {
    let prev = null, sig = null;
    l.forEach((m) => { if (m.end <= pos + EPS && (!prev || m.end >= prev.end)) prev = m; if (m.start >= pos - EPS && !sig) sig = m; });
    const midi = prev ? prev.midi : sig ? sig.midi : Math.round(v.med);
    const vels = v.base.map((b) => b.vel).filter(Boolean).sort((a, b) => a - b);
    key = '+' + (++ed.nuevoId);
    c[key] = { nuevo: true, t: v.t, ch: v.ch, midi, start: pos, end: pos + L, vel: vels.length ? vels[vels.length >> 1] : 80 };
  }
  if (sincronizar()) aplicarWarp({ s: pos, e: pos, d: L }, c);   // se hace sitio en todas las voces
  else {
    if (!asegurarCompases(Math.max(r.fin, pos + L))) { if (key) ed.nuevoId--; return; }
    aplicar(c);
  }
  if (key) elegir(key, true); else elegirSilencio(pos);
  avisoCorridas(r.movidas);
}
function insertarDesdePanel(nota) {
  const L = +$('#ed-ins-dur').value, n = linea()[idxDe(ed.key)], h = !n && ed.rs ? huecoEn(ed.rs.ini) : null;
  if (!n && !h) return;
  const antes = $('#ed-ins-pos').value === 'antes';
  insertarEn(n ? (antes ? n.start : n.end) : h.ini, L, nota);
}

function cambiarAltura(d) {
  const n = linea()[idxDe(ed.key)];
  if (!n) return;
  const m = Math.max(21, Math.min(108, n.midi + d));
  if (m === n.midi) return;
  aplicar({ [n.key]: { midi: m } });
  const r = RANGOS.find((x) => x.re.test(P.nombreVoz()));
  if (r && (m < r.lo || m > r.hi)) aviso(`${nombreNota(m)} queda fuera del rango habitual de ${r.nombre} (${r.txt}).`);
  if (!P.reproduciendo()) P.previsualizar(m);
}

// Escribir una nota en el silencio elegido: empieza donde empieza el silencio; si es más larga que el hueco, corre las siguientes.
function insertarNota(L) {
  const v = P.voz(), h = ed.rs && huecoEn(ed.rs.ini);
  if (!h) return;
  if (v.t === undefined) { aviso('Esta voz no se puede editar.'); return; }
  const l = linea(), c = {};
  let r = { movidas: 0, fin: h.ini + L };
  const falta = h.ini + L - h.fin, sinc = sincronizar() && falta > EPS;
  if (falta > EPS && !sinc) r = cascada(h.fin, h.ini + L, c);   // no cabe en el hueco: las siguientes se corren
  if (!sinc && !asegurarCompases(r.fin)) return;
  let prev = null, sig = null;
  l.forEach((n) => { if (n.end <= h.ini + EPS && (!prev || n.end >= prev.end)) prev = n; if (n.start >= h.ini - EPS && !sig) sig = n; });
  const midi = prev ? prev.midi : sig ? sig.midi : Math.round(v.med);   // empieza con la altura de la nota vecina
  const vels = v.base.map((b) => b.vel).filter(Boolean).sort((a, b) => a - b);
  const key = '+' + (++ed.nuevoId);
  c[key] = { nuevo: true, t: v.t, ch: v.ch, midi, start: h.ini, end: h.ini + L, vel: vels.length ? vels[vels.length >> 1] : 80 };
  if (sinc) aplicarWarp({ s: h.fin, e: h.fin, d: falta }, c); else aplicar(c);   // con todas las voces, se añade el tiempo que falta
  elegir(key, true);
  avisoCorridas(r.movidas);
}

// La nota deja de sonar y en su lugar queda un silencio, que se puede elegir para escribir otra nota.
function convertirEnSilencio() {
  const n = linea()[idxDe(ed.key)];
  if (!n) return;
  aplicar({ [n.key]: { del: true } });
  ed.key = null;
  elegirSilencio(n.start);
  if (!ed.rs) { pintar(); actualizarPanel(); }
}

// Quita el silencio elegido cerrando el hueco. Con todas las voces, solo si ninguna otra suena en ese tramo.
function quitarSilencio() {
  const h = ed.rs && huecoEn(ed.rs.ini);
  if (!h) return;
  const largo = h.fin - h.desde;
  if (h.fin >= S().song.total - EPS) { aviso('Ese silencio es el final de la pieza: quita compases si sobran.'); return; }
  if (largo < EPS) return;
  if (sincronizar()) {
    const otra = S().song.voices.find((v) => v.notes.some((n) => n.end > h.desde + EPS && n.start < h.fin - EPS));
    if (otra) { aviso('No se puede quitar: «' + otra.name + '» tiene notas en ese tramo. Alarga mejor la nota anterior (se aplica a todas las voces).'); return; }
    ed.rs = null;
    aplicarWarp({ s: h.desde, e: h.fin, L: 0, d: -largo });
  } else {
    const c = {};
    correr(h.fin, -largo, c);
    ed.rs = null;
    aplicar(c);
  }
}

function agregarCompas() {
  if (ed.extra >= MAX_COMPASES_EXTRA) { aviso('Máximo ' + MAX_COMPASES_EXTRA + ' compases añadidos.'); return; }
  ed.extra++; guardarHist(); refrescar();
}
function quitarCompas() {
  if (ed.extra <= 0) { aviso('Solo se pueden quitar los compases que añadiste.'); return; }
  const song = S().song, inicio = (song.nMeas - 1) * song.mb;
  if (song.voices.some((v) => v.notes.some((n) => n.end > inicio + EPS))) { aviso('El último compás tiene notas: quítalas antes de borrar el compás.'); return; }
  ed.extra--; guardarHist(); refrescar();
}

// Letra de la estrofa v (0 = la primera) de una nota.
function cambiarLetra(key, texto, v) {
  const n = linea()[idxDe(key)];
  if (!n) return false;
  v = v || 0;
  const t = String(texto).replace(/[\r\n]+/g, ' ').slice(0, 60);
  const est = [n.letra || ''].concat(n.extras || []);
  while (est.length <= v) est.push('');
  if (est[v] === t) return false;
  est[v] = t;
  while (est.length > 1 && !est[est.length - 1]) est.pop();
  aplicar({ [n.key]: { letra: est[0], extras: est.slice(1) } });
  return true;
}
// Cuántas estrofas se muestran: las que ya tienen alguna nota de la voz y las que el usuario añadió.
const nEstrofas = () => Math.max(ed.estrofas, 1 + Math.max(0, ...linea().map((n) => (n.extras || []).length)));
function nuevaEstrofa() {
  if (ed.estrofas >= 6 && nEstrofas() >= 6) { aviso('Máximo 6 estrofas.'); return; }
  ed.estrofas = Math.min(6, nEstrofas() + 1);
  actualizarPanel();
  const inp = $('#ed-letras').lastElementChild; if (inp && !inp.disabled) inp.focus();
}
async function quitarEstrofa() {
  const N = nEstrofas();
  if (N <= 1) return;
  const con = linea().filter((n) => (n.extras || []).length >= N - 1 && (n.extras || [])[N - 2]);
  if (con.length && !(await confirmar({ title: 'Quitar la última estrofa', text: `Se borrará la letra de la estrofa ${N} en ${con.length} nota(s).`, confirmButtonText: 'Quitar', cancelButtonText: 'Cancelar' }))) return;
  const c = {};
  linea().forEach((n) => { if ((n.extras || []).length >= N - 1) c[n.key] = { extras: n.extras.slice(0, N - 2) }; });
  ed.estrofas = N - 1;
  if (Object.keys(c).length) aplicar(c); else actualizarPanel();
}

function deshacer() { if (ed.pos > 0) { ed.pos--; restaurar(ed.hist[ed.pos]); } }
function rehacer() { if (ed.pos < ed.hist.length - 1) { ed.pos++; restaurar(ed.hist[ed.pos]); } }
function reiniciarCambios() {
  ed.ov = {}; ed.extra = 0; ed.warps = []; ed.hist = [{ ov: {}, extra: 0, warps: [] }]; ed.pos = 0; ed.key = null; ed.rs = null;
  if (P && S().song && S().song.voices) reconstruir();
}

async function descartar() {
  if (!cambios()) return;
  const ok = await confirmar({ title: '¿Descartar los cambios?', text: `Se perderán ${cambios()} cambio(s) desde que abriste la pieza.`, confirmButtonText: 'Descartar', cancelButtonText: 'Seguir editando' });
  if (!ok) return;
  reiniciarCambios(); P.render();
}

/* ------------------------------------------------------------------ guardar versión */
function textoResumen(r) {
  return [
    r.duraciones && `${r.duraciones} duración(es)`, r.alturas && `${r.alturas} altura(s)`,
    r.agregadas && `${r.agregadas} nota(s) nueva(s)`, r.sustituidas && `${r.sustituidas} nota(s) quitada(s)`,
    r.letras && `${r.letras} letra(s)`, r.sincronizadas && `${r.sincronizadas} cambio(s) de tiempo en todas las voces`, r.compases && `${r.compases} compás(es) añadido(s)`
  ].filter(Boolean).join(' · ');
}
// Solo se ha escrito letra: no cambia ninguna nota, así que no hace falta una versión nueva.
const soloLetra = (r) => r.letras > 0 && !r.duraciones && !r.alturas && !r.agregadas && !r.sustituidas && !r.compases && !r.sincronizadas;

// Letra sola: se actualiza el mismo MIDI en la Biblioteca.
async function guardarLetra(r) {
  const nombre = $('#title').textContent;
  const ok = await confirmar({
    icon: 'question', title: 'Guardar la letra',
    html: `Se actualizará <b>${esc(nombre)}</b> con ${r.letras} letra(s).<br>No se crea una versión nueva porque no cambia ninguna nota.`,
    confirmButtonText: 'Guardar letra', cancelButtonText: 'Cancelar'
  });
  if (!ok) return;
  ed.guardando = true;
  const song = S().song, compases = song.nMeas;
  const bytes = escribirMidi(song.raw, ed.ov, ed.extra, song.total, ed.warps);
  const meta = window.Ensayo.analizar(bytes.buffer);
  meta.compases = compases;
  const it = await ejecutar('actualizarMidi', ed.libId, aBase64(bytes), meta);
  window.Ensayo.cargarMidi(bytes.buffer, it.titulo, 'lib|' + it.id, compases, it.meta);
  toastExito('Letra guardada en ' + it.titulo);
}
async function guardarVersion() {
  const r = resumen();
  if (!r.total || ed.guardando) return;
  const btn = $('#ed-guardar');
  btn.disabled = true;
  try {
    if (soloLetra(r)) { await guardarLetra(r); return; }
    const prop = await ejecutar('proximaVersion', ed.libId);
    const ok = await confirmar({
      icon: 'question', title: 'Guardar como nueva versión',
      html: `Se guardará como <b>${esc(prop.nombre)}</b> en la Biblioteca.<br><br>${r.total} cambio(s): ${esc(textoResumen(r))}.<br>El archivo original no se toca.`,
      confirmButtonText: 'Guardar versión', cancelButtonText: 'Cancelar'
    });
    if (!ok) return;
    ed.guardando = true;
    const song = S().song, compases = song.nMeas;
    const bytes = escribirMidi(song.raw, ed.ov, ed.extra, song.total, ed.warps);
    const meta = window.Ensayo.analizar(bytes.buffer);
    meta.compases = compases;   // incluye los compases de silencio añadidos
    const it = await ejecutar('guardarVersion', ed.libId, aBase64(bytes), meta, r);
    // Se abre la versión recién guardada: ahí se podrá seguir editando para crear la siguiente.
    window.Ensayo.cargarMidi(bytes.buffer, it.titulo, 'lib|' + it.id, compases, it.meta);
    toastExito('Guardado como ' + it.titulo);
  } catch (e) {
    toastError((e && e.message ? String(e.message).replace(/^(Error|Exception):\s*/, '') : 'No se pudo guardar la versión.'));
  } finally {
    ed.guardando = false; btn.disabled = false; actualizarPanel();
  }
}

/* ------------------------------------------------------------------ interfaz */
const puedeEditar = () => !!(ed.libId && S().song && S().song.raw);

function pintar() {
  if (!P || !ed.activo) return;
  const l = linea();
  P.piezas().forEach((p) => {
    if (p.noteIdx >= 0) {
      const n = l[p.noteIdx];
      if (!n) return;
      p.g.classList.toggle('editsel', n.key === ed.key);
      p.g.classList.toggle('mod', !!ed.ov[n.key]);
    } else if (p.rs) {
      p.g.classList.toggle('editsel', !!ed.rs && ed.rs.ini >= p.rs.ini - EPS && ed.rs.ini < p.rs.ini + p.rs.len - EPS);
    }
  });
}

function compasYTiempo(inicio) {
  const mb = S().song.mb;
  const c = Math.floor(inicio / mb + EPS), t = inicio - c * mb;
  return `compás ${c + 1}, tiempo ${num(t + 1)}`;
}

function actualizarPanel() {
  if (!P) return;
  const btn = $('#btnEditar'), panel = $('#panel-edicion');
  const puede = puedeEditar();
  btn.disabled = !puede && !ed.activo;
  btn.title = puede ? 'Editar notas, silencios y letra' : 'Abre una pieza de la Biblioteca para poder editarla';
  btn.setAttribute('aria-pressed', ed.activo);
  btn.classList.toggle('btn-primario', ed.activo);
  btn.querySelector('span').textContent = ed.activo ? 'Terminar edición' : 'Editar';
  panel.classList.toggle('oculto', !ed.activo);
  if (!ed.activo) return;

  const l = linea(), i = idxDe(ed.key), n = i >= 0 ? l[i] : null, r = resumen();
  const h = !n && ed.rs ? huecoEn(ed.rs.ini) : null;
  if (ed.rs && !h) ed.rs = null;   // ese silencio ya no existe (se ocupó o la pieza cambió)
  const b = n ? ed.base.get(n.key) : null;

  if (n) {
    $('#ed-nota').textContent = `${nombreNota(n.midi)} · ${nombreDur(n.end - n.start)}`;
    let sub = compasYTiempo(n.start);
    if (b && ed.ov[n.key]) sub += ` · modificada (original: ${nombreNota(b.midi)} · ${nombreDur(b.end - b.start)})`;
    else if (!b) sub += ' · nota nueva';
    $('#ed-sub').textContent = sub;
  } else if (h) {
    $('#ed-nota').textContent = 'Silencio · ' + compasYTiempo(h.ini);
    $('#ed-sub').textContent = `Hueco libre de ${num(h.fin - h.ini)} tiempo(s). Elige una duración para escribir una nota ahí; con ◀ ▶ mueves el punto de inserción.`;
  } else {
    $('#ed-nota').textContent = 'Toca una nota o un silencio de la partitura';
    $('#ed-sub').textContent = `Voz: ${P.nombreVoz()}`;
  }
  $('#ed-dur-etiqueta').textContent = h ? 'Escribir una nota de…' : 'Duración';

  document.querySelectorAll('#ed-durs button').forEach((x) => {
    const L = +x.dataset.l, base = `${nombreDur(L)} (${L} tiempo${L === 1 ? '' : 's'})`;
    if (h) {
      const cabe = h.ini + L <= h.fin + EPS;
      x.classList.remove('activo'); x.classList.toggle('choca', !cabe);
      x.disabled = false;
      x.title = base + (cabe ? ' · escribe una nota aquí' : ' · no cabe en el silencio: las notas siguientes se corren');
      return;
    }
    const largo = n ? n.end - n.start : 0, fin = n ? n.start + L : 0;
    x.classList.toggle('activo', !!n && Math.abs(largo - L) < EPS);
    x.disabled = !n;
    const pisa = !!n && fin > n.end + EPS && pisadas(i, fin).length > 0;
    x.classList.toggle('choca', pisa);
    x.title = base + (pisa ? ' · las notas siguientes se corren' : '');
  });
  $('#ed-ins-nota').disabled = !n && !h; $('#ed-ins-sil').disabled = !n && !h;
  $('#ed-ins-pos').disabled = !n;
  $('#ed-quitar-sil').disabled = !h || h.fin >= S().song.total - EPS || h.fin - h.desde < EPS;
  ['ed-oct-bajar', 'ed-semi-bajar', 'ed-semi-subir', 'ed-oct-subir', 'ed-silencio'].forEach((id) => { $('#' + id).disabled = !n; });
  $('#ed-prev').disabled = !l.length; $('#ed-next').disabled = !l.length;
  $('#ed-deshacer').disabled = ed.pos === 0; $('#ed-rehacer').disabled = ed.pos >= ed.hist.length - 1;
  $('#ed-descartar').disabled = !r.total;
  $('#ed-guardar').disabled = !r.total || ed.guardando;
  const letraSola = soloLetra(r);
  $('#ed-guardar span').textContent = letraSola ? 'Guardar letra' : 'Guardar versión';
  $('#ed-guardar').title = letraSola ? 'Guardar la letra en este mismo MIDI (sin versión nueva)' : 'Guardar los cambios como una versión nueva';
  $('#ed-comp-menos').disabled = ed.extra === 0;
  $('#ed-contador').textContent = r.total ? String(r.total) : '';

  const N = nEstrofas(), caja = $('#ed-letras');
  while (caja.children.length < N) {   // un campo por estrofa
    const nuevo = document.createElement('input');
    nuevo.type = 'text'; nuevo.maxLength = 60; nuevo.autocomplete = 'off'; nuevo.spellcheck = false;
    nuevo.id = 'ed-letra-' + (caja.children.length + 1); nuevo.dataset.v = caja.children.length; nuevo.className = 'ed-letra-in';
    caja.appendChild(nuevo);
  }
  while (caja.children.length > N) caja.removeChild(caja.lastElementChild);
  [...caja.children].forEach((inp, v) => {
    inp.disabled = !n;
    inp.placeholder = v === 0 ? 'Sílaba o texto · Enter pasa a la siguiente nota' : 'Estrofa ' + (v + 1) + ' (debajo de la anterior)';
    inp.setAttribute('aria-label', 'Letra, estrofa ' + (v + 1));
    if (document.activeElement !== inp || inp.dataset.key !== (ed.key || '')) {   // no pisar lo que se está escribiendo
      inp.value = n ? (v === 0 ? (n.letra || '') : ((n.extras || [])[v - 1] || '')) : '';
      inp.dataset.key = ed.key || '';
    }
  });
  $('#ed-estrofa-menos').disabled = N <= 1;
  $('#ed-estrofa-mas').disabled = N >= 6;
  $('#ed-aviso').textContent = polifonica(P.voz())
    ? 'Esta voz tiene notas simultáneas (divisi): solo se editan las notas que ves en la partitura; las demás no se tocan.' : '';
}

async function activar(si) {
  if (si === ed.activo) return;
  if (si) {
    if (!puedeEditar()) { aviso('Abre una pieza de la Biblioteca para poder editarla.'); return; }
    window.Ensayo.limpiarSeleccion();
    ed.activo = true;
    document.body.classList.add('modo-edicion');
    P.render(); actualizarPanel();
  } else {
    if (cambios() && !(await confirmar({ title: 'Hay cambios sin guardar', text: `Tienes ${cambios()} cambio(s) que todavía no están en ninguna versión.`, confirmButtonText: 'Descartar y salir', cancelButtonText: 'Seguir editando' }))) return;
    reiniciarCambios();
    ed.activo = false;
    document.body.classList.remove('modo-edicion');
    P.render(); actualizarPanel();
  }
}

// Se llama antes de cargar otra pieza: pide confirmación si hay cambios sin guardar.
async function confirmarDescarte() {
  if (!cambios()) return true;
  return confirmar({ title: 'Hay cambios sin guardar', text: `Si abres otra pieza se perderán ${cambios()} cambio(s).`, confirmButtonText: 'Descartar y abrir', cancelButtonText: 'Quedarme aquí' });
}

function alClicNota(pn, rs) {
  if (!ed.activo) return false;
  if (pn) {
    const n = linea()[+pn.getAttribute('data-note')];
    if (n && n.key) elegir(n.key, true);
  } else if (rs) {
    elegirSilencio(+rs.getAttribute('data-rs'));
  }
  return true;   // en modo edición el clic no elige tramos
}
function alCargar(song, key) {
  ed.activo = false; document.body.classList.remove('modo-edicion');
  ed.ov = {}; ed.extra = 0; ed.warps = []; ed.hist = [{ ov: {}, extra: 0, warps: [] }]; ed.pos = 0; ed.key = null; ed.rs = null; ed.nuevoId = 0; ed.estrofas = 1;
  ed.libId = key && key.indexOf('lib|') === 0 ? key.slice(4) : null;
  ed.nMeasBase = song.nMeas;
  ed.base = new Map();
  song.voices.forEach((v) => { if (v.base) v.base.forEach((b) => ed.base.set(b.key, b)); });
  $('#panel-edicion').classList.add('oculto');
  Promise.resolve().then(actualizarPanel);   // el estado de la pieza se asigna justo después de este enganche
}

function init() {
  if (!window.Ensayo || !window.Ensayo.puente) return;
  P = window.Ensayo.puente;
  P.hooks.alRenderizar = () => { pintar(); actualizarPanel(); };
  P.hooks.alClicNota = alClicNota;
  P.hooks.alCargar = alCargar;

  const cont = $('#ed-durs');
  DURACIONES.forEach((d) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.l = d.l; b.className = 'ed-dur';
    b.innerHTML = `<span class="ed-dur-n">${d.n}</span><span class="ed-dur-v">${d.l}</span>`;
    b.addEventListener('click', () => cambiarDuracion(d.l));
    cont.appendChild(b);
  });
  $('#btnEditar').addEventListener('click', () => activar(!ed.activo));
  $('#ed-oct-bajar').addEventListener('click', () => cambiarAltura(-12));
  $('#ed-semi-bajar').addEventListener('click', () => cambiarAltura(-1));
  $('#ed-semi-subir').addEventListener('click', () => cambiarAltura(1));
  $('#ed-oct-subir').addEventListener('click', () => cambiarAltura(12));
  $('#ed-prev').addEventListener('click', () => vecina(-1));
  $('#ed-next').addEventListener('click', () => vecina(1));
  $('#ed-silencio').addEventListener('click', convertirEnSilencio);
  $('#ed-quitar-sil').addEventListener('click', quitarSilencio);
  DURACIONES.forEach((d) => { const o = document.createElement('option'); o.value = d.l; o.textContent = `${d.n} (${d.l})`; $('#ed-ins-dur').appendChild(o); });
  $('#ed-ins-dur').value = '1';
  $('#ed-ins-nota').addEventListener('click', () => insertarDesdePanel(true));
  $('#ed-ins-sil').addEventListener('click', () => insertarDesdePanel(false));
  $('#ed-comp-mas').addEventListener('click', agregarCompas);
  $('#ed-comp-menos').addEventListener('click', quitarCompas);
  $('#ed-deshacer').addEventListener('click', deshacer);
  $('#ed-rehacer').addEventListener('click', rehacer);
  $('#ed-descartar').addEventListener('click', descartar);
  $('#ed-guardar').addEventListener('click', guardarVersion);
  $('#voice').addEventListener('change', () => setTimeout(actualizarPanel, 0));

  // Letra: se guarda al salir del campo; Enter o Tab pasan a la nota siguiente (Mayús+Tab, a la anterior) sin perder el foco.
  // En cada estrofa, Enter/Tab pasan a la misma estrofa de la nota vecina.
  const caja = $('#ed-letras');
  caja.addEventListener('change', (e) => { const inp = e.target; cambiarLetra(inp.dataset.key, inp.value, +inp.dataset.v); });
  caja.addEventListener('keydown', (e) => {
    const inp = e.target, v = +inp.dataset.v;
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      cambiarLetra(inp.dataset.key, inp.value, v);
      vecina(e.shiftKey ? -1 : 1);
      setTimeout(() => { const sig = caja.children[v]; if (sig) { sig.focus(); sig.select(); } }, 0);
    } else if (e.key === 'Escape') { inp.blur(); }
  });
  $('#ed-estrofa-mas').addEventListener('click', nuevaEstrofa);
  $('#ed-estrofa-menos').addEventListener('click', quitarEstrofa);

  addEventListener('keydown', (e) => {
    if (!ed.activo || $('#panel-ensayo').classList.contains('oculto') || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (document.querySelector('.swal2-popup:not(.swal2-toast)')) return;
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? rehacer() : deshacer(); }
    else if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); rehacer(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { if (ed.key) { e.preventDefault(); cambiarAltura((e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 12 : 1)); } }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); vecina(e.key === 'ArrowRight' ? 1 : -1); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && ed.key) { e.preventDefault(); convertirEnSilencio(); }
  });
  addEventListener('beforeunload', (e) => { if (cambios()) { e.preventDefault(); e.returnValue = ''; } });
  refrescarIconos();
  actualizarPanel();
}

window.Edicion = { confirmarDescarte, escribirMidi, resumen, cambios, _ed: ed };
if (document.readyState === 'loading') addEventListener('DOMContentLoaded', init); else init();
})();
</script>
